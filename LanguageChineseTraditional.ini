Show live listings from Marketbuddy==顯示 Marketbuddy 的實際掛單
Marketbuddy passively remembers the real listings it has seen on the market board for the world you are on (up to 1 hour).\nThose are real, world-local prices; Universalis is crowd-uploaded and can be days old.\nHas no effect when Marketbuddy is not installed.==Marketbuddy 會被動記下它在市場佈告板上看到的真實掛單（限你目前所在的世界，最多保留 1 小時）。\n那是本服真實的掛單價格；Universalis 則是玩家群眾上傳的，可能已經是好幾天前的資料。\n未安裝 Marketbuddy 時此選項不會有任何作用。
(unavailable until the plugin is updated for this game version)==（遊戲改版後暫時無法使用，等插件更新）
Show prices for items after exchange==顯示可交換道具換成的道具價格
For items that can't be sold as-is but can be exchanged for a sellable item\n(e.g. Diadem Skybuilders' materials after inspection), show the market price of the item they become.\nThe tooltip says how many are needed for one.==本身不能在市場出售、但可以交換成可出售道具的物品（例如雲冠群島的重建用素材經過道具檢驗），改為顯示交換後那個道具的市場價格。\n提示視窗會註明需要幾個才能換 1 個。
