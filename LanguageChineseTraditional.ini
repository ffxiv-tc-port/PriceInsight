Price Insight Config==Price Insight 設定
Tap Alt to refresh prices==按住 Alt 以重新整理價格
Prefetch prices for items in inventory==預先擷取背包內道具的價格
Prefetch prices for all items in inventory, chocobo saddlebag and retainer when logging in.==登入時預先擷取背包、陸行鳥背包與僱員身上所有道具的價格。
Use current world as home world==以目前所在的世界作為本服
The current world you're on will be considered your "home world".\nUseful if you're datacenter travelling and want to see prices there.==你目前所在的世界將被視為你的「本服」。\n適合在跨資料中心旅行時查看當地價格。
Show cheapest price in:==顯示最低價格的範圍：
Region==大區域
Datacenter==資料中心
Home world==本服
Show most recent purchase in:==顯示最近成交紀錄的範圍：
Show sales per day==顯示每日銷售量
Do not show==不顯示
World==本服
Show the average sales per day based on sales of the last 4 days.==依據最近 4 天的銷售紀錄，顯示平均每日銷售量。
Show average sale price==顯示平均成交價格
Show the average sale price based on sales of the last 4 days.==依據最近 4 天的銷售紀錄，顯示平均成交價格。
Show stack sale price==顯示整組出售價格
Show the price of the hovered stack if sold at the given unit price.==顯示以目前單價計算，出售目前懸停堆疊數量的總價格。
Show age of data==顯示資料更新時間
Show when the price info was last refreshed.\nCan be turned off to reduce tooltip bloat.==顯示價格資訊最後一次更新的時間。\n可關閉此選項以減少提示視窗內容過多的問題。
Show datacenter for foreign worlds==為外部世界顯示所屬資料中心
Show the datacenter for worlds from other datacenters when displaying prices for the entire region.\nCan be turned off to reduce tooltip bloat.==在顯示整個大區域的價格時，為其他資料中心的世界顯示所屬資料中心。\n可關閉此選項以減少提示視窗內容過多的問題。
Always display NQ and HQ prices==永遠同時顯示普通品與高品質價格
Show the prices for both NQ and HQ of an item.\nWhen turned off will only display price for the current quality (use Ctrl to switch between NQ and HQ).==同時顯示該道具的普通品與高品質價格。\n關閉後將只顯示目前品質的價格（可按住 Ctrl 切換普通品/高品質）。
Include all datacenters available via datacenter traveling.==包含所有可透過資料中心旅行前往的資料中心。
